spring.application.name=car-sharing-app
server.port=${SPRING_LOCAL_PORT:8081}

spring.datasource.url=jdbc:mysql://localhost:${MYSQLDB_LOCAL_PORT:3308}/${MYSQLDB_DATABASE:car_sharing_app}
spring.datasource.username=${MYSQLDB_USER:user}
spring.datasource.password=${MYSQLDB_PASSWORD:1234}

spring.liquibase.change-log=db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:THIS_IS_MY_SUPER_LONG_SECRET_KEY_FOR_JWT_TOKEN_GENERATION_1234567890_ABCDEF}
jwt.expiration=${JWT_EXPIRATION:3600000}

stripe.secret-key=${STRIPE_SECRET_KEY:test}
stripe.success-url=http://localhost:${SPRING_LOCAL_PORT:8081}/payments/success?session_id={CHECKOUT_SESSION_ID}
stripe.cancel-url=http://localhost:${SPRING_LOCAL_PORT:8081}/payments/cancel

telegram.bot-token=${TELEGRAM_BOT_TOKEN:test}
telegram.chat-id=${TELEGRAM_CHAT_ID:test}

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000